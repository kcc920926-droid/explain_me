<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UI 시안 선택</title>
  <style>
    :root { color-scheme: light dark; --bg:#f5f5f2; --surface:#fff; --ink:#20272c; --muted:#626c74; --line:#dce0de; --accent:#3357cf; --tint:#edf1ff; --preview:#f1f3f4; --shadow:0 12px 40px #1d29380c; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible,input:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
    button:disabled { opacity:.45; cursor:default; }
    .shell { width:min(1320px,100%); margin:0 auto; padding:32px 40px 26px; }
    .topline { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:25px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; font-size:12px; font-weight:750; letter-spacing:.1em; }
    .brand-mark { display:grid; grid-template-columns:repeat(2,5px); gap:3px; transform:rotate(-10deg); }
    .brand-mark i { width:5px; height:5px; background:var(--accent); border-radius:1px; }
    .steps { display:flex; gap:22px; color:var(--muted); font-size:12px; }
    .steps .active { color:var(--accent); font-weight:750; }
    header { display:flex; justify-content:space-between; align-items:end; gap:24px; padding:30px 0 24px; }
    .eyebrow { margin:0 0 7px; color:var(--accent); font-size:11px; font-weight:750; letter-spacing:.12em; }
    h1 { font-size:clamp(25px,3vw,36px); line-height:1.3; letter-spacing:-.045em; margin:0; }
    .project { margin:8px 0 0; font-size:13px; color:var(--muted); overflow-wrap:anywhere; }
    .intro { max-width:340px; margin:0 0 2px; color:var(--muted); font-size:13px; }
    .intro strong { color:var(--ink); font-weight:650; }
    .gallery { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }
    .card { position:relative; min-width:0; border:1px solid var(--line); border-radius:16px; background:var(--surface); overflow:hidden; box-shadow:var(--shadow); transition:border-color .16s,box-shadow .16s; }
    .card:has(input:checked) { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); }
    .card:hover { border-color:var(--accent); }
    .card-select { display:block; cursor:pointer; }
    .card-top { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; }
    .number { font-size:12px; letter-spacing:.09em; font-weight:750; color:var(--muted); }
    .radio-label { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:11px; }
    input[type=radio] { width:17px; height:17px; accent-color:var(--accent); margin:0; }
    .preview { display:flex; align-items:center; justify-content:center; height:188px; padding:13px 16px; background:var(--preview); border-block:1px solid var(--line); }
    .preview img { width:100%; height:100%; object-fit:contain; border-radius:3px; }
    .copy { display:block; padding:14px 16px 17px; }
    .card-title { display:block; font-size:16px; font-weight:700; letter-spacing:-.02em; }
    .description { display:block; margin-top:4px; color:var(--muted); font-size:12px; line-height:1.55; overflow-wrap:anywhere; }
    .expand { position:absolute; top:196px; right:13px; border:1px solid var(--line); border-radius:7px; background:var(--surface); color:var(--ink); padding:4px 9px; font-size:11px; box-shadow:0 2px 5px #0000000a; }
    .note { margin:19px 0 0; font-size:11px; color:var(--muted); }
    footer { position:sticky; bottom:0; z-index:2; border-top:1px solid var(--line); background:var(--surface); }
    .footer-content { width:min(1320px,100%); margin:auto; padding:17px 40px; display:flex; align-items:center; justify-content:space-between; gap:24px; }
    #selection-title { font-size:14px; font-weight:700; margin:0; }
    #status { font-size:12px; color:var(--muted); margin:2px 0 0; overflow-wrap:anywhere; }
    .primary { flex-shrink:0; border:0; border-radius:10px; padding:13px 24px; background:var(--accent); color:#fff; font-weight:650; font-size:13px; }
    dialog { width:min(1240px,96vw); max-height:94vh; padding:0; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:0 24px 90px #0004; }
    dialog::backdrop { background:#101923a6; backdrop-filter:blur(4px); }
    .dialog-top { display:flex; justify-content:space-between; align-items:center; gap:20px; padding:16px 20px; border-bottom:1px solid var(--line); }
    .dialog-top h2 { margin:0; font-size:16px; }
    .dialog-actions { display:flex; gap:10px; }
    .secondary { border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:7px; padding:6px 11px; font-size:12px; white-space:nowrap; }
    .zoom-window { max-height:calc(94vh - 76px); overflow:auto; padding:18px; background:var(--preview); }
    #large-preview { display:block; width:100%; }
    .zoom-window.zoomed #large-preview { width:max(100%,1400px); max-width:none; }
    @media(prefers-color-scheme:dark) {
      :root { --bg:#14181e; --surface:#1d232b; --ink:#edf1f6; --muted:#abb6c3; --line:#39434e; --accent:#8da9ff; --tint:#28354d; --preview:#141a22; --shadow:none; }
      .primary { background:#4965ce; }
    }
    @media(max-width:1050px) { .gallery { grid-template-columns:repeat(2,minmax(0,1fr)); } header { align-items:start; flex-direction:column; gap:13px; } .intro { max-width:none; } }
    @media(max-width:600px) {
      .shell { padding:20px 18px; } .topline { align-items:start; padding-bottom:19px; } .steps { flex-direction:column; gap:2px; font-size:10px; }
      header { padding-top:23px; } .gallery { grid-template-columns:minmax(0,1fr); gap:16px; }
      .preview { height:205px; } .expand { top:213px; } .footer-content { padding:13px 18px; flex-direction:column; align-items:stretch; gap:12px; }
      .primary { width:100%; } .dialog-top { align-items:start; padding:12px; } .dialog-actions { gap:5px; } .secondary { padding:5px 8px; font-size:11px; }
    }
    @media(prefers-reduced-motion:reduce) { .card { transition:none; } }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topline" aria-label="진행 단계">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>EXPLAIN ME / DESIGN REVIEW</div>
      <div class="steps"><span>01 분석</span><span class="active" aria-current="step">02 시안 선택</span><span>03 최종 완성</span></div>
    </nav>
    <header>
      <div><p class="eyebrow">CHOOSE YOUR VISUAL DIRECTION</p><h1>어떤 시안으로 진행할까요?</h1><p class="project" id="project"></p></div>
      <p class="intro"><strong>같은 분석, __OPTION_COUNT__가지 표현.</strong><br>시안을 크게 살펴보고 마음에 드는 하나를 선택하세요.</p>
    </header>
    <section class="gallery" id="gallery" aria-label="UI 시안 __OPTION_COUNT__개"></section>
    <p class="note">번호 하나를 선택하면 해당 구성으로 설명을 완성합니다. 수정 요청은 대화로 남겨주세요.</p>
  </main>
  <footer>
    <div class="footer-content">
      <div aria-live="polite"><p id="selection-title">아직 선택한 시안이 없습니다</p><p id="status">__OPTION_COUNT__개 시안을 살펴본 후 하나를 선택해주세요.</p></div>
      <button class="primary" id="confirm" type="button" disabled>이 시안으로 진행 <span aria-hidden="true">→</span></button>
    </div>
  </footer>
  <dialog id="detail" aria-labelledby="detail-title">
    <div class="dialog-top"><h2 id="detail-title"></h2><div class="dialog-actions"><button class="secondary" id="zoom" type="button" aria-pressed="false">더 크게</button><button class="secondary" id="close" type="button">닫기 <span aria-hidden="true">×</span></button></div></div>
    <div class="zoom-window" id="zoom-window"><img id="large-preview" alt=""></div>
  </dialog>
  <noscript>선택 기능에는 JavaScript가 필요합니다. SVG 시안 __OPTION_COUNT__개를 확인한 뒤 대화에서 번호를 알려주세요.</noscript>
  <script id="gallery-data" type="application/json">/*__GALLERY_DATA__*/</script>
  <script>
    "use strict";
    const data = JSON.parse(document.getElementById("gallery-data").textContent);
    const gallery = document.getElementById("gallery");
    const confirmButton = document.getElementById("confirm");
    const statusLine = document.getElementById("status");
    const selectionTitle = document.getElementById("selection-title");
    const detail = document.getElementById("detail");
    const zoomWindow = document.getElementById("zoom-window");
    const zoomButton = document.getElementById("zoom");
    let selected = null;
    document.title = data.title;
    document.getElementById("project").textContent = data.title;

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function select(option) {
      selected = option;
      selectionTitle.textContent = `${option.id}번 · ${option.name}`;
      statusLine.textContent = data.token ? "이 시안으로 진행 버튼을 누르면 선택이 저장됩니다." : "이 시안으로 진행 버튼을 누르면 전달용 선택 파일을 내려받습니다.";
      confirmButton.disabled = false;
    }
    for (const option of data.options) {
      const card = element("article", "card");
      const label = element("label", "card-select");
      const top = element("span", "card-top");
      const radioLabel = element("span", "radio-label", "선택");
      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "design";
      radio.value = option.id;
      radio.setAttribute("aria-label", `${option.id}번 ${option.name}`);
      radio.addEventListener("change", () => select(option));
      radioLabel.append(radio);
      top.append(element("span", "number", `DRAFT ${String(option.id).padStart(2, "0")}`), radioLabel);
      const preview = element("span", "preview");
      const img = document.createElement("img");
      img.src = option.image;
      img.alt = `${option.name} SVG 시안`;
      preview.append(img);
      const copy = element("span", "copy");
      copy.append(element("span", "card-title", option.name), element("span", "description", option.description));
      label.append(top, preview, copy);
      const expand = element("button", "expand", "크게 보기 ↗");
      expand.type = "button";
      expand.setAttribute("aria-label", `${option.id}번 ${option.name} 크게 보기`);
      expand.addEventListener("click", () => {
        document.getElementById("detail-title").textContent = `${option.id}번 · ${option.name}`;
        const large = document.getElementById("large-preview");
        large.src = option.image;
        large.alt = `${option.name} 전체 시안`;
        zoomWindow.classList.remove("zoomed");
        zoomButton.setAttribute("aria-pressed", "false");
        zoomButton.textContent = "더 크게";
        detail.showModal();
      });
      card.append(label, expand);
      gallery.append(card);
    }
    if (data.saved.state === "selected") {
      const option = data.options.find(option => option.id === data.saved.selection.selected_id);
      gallery.querySelector(`input[value="${option.id}"]`).checked = true;
      select(option);
      statusLine.textContent = `${option.id}번 선택이 저장되어 있습니다. 다른 시안으로 변경할 수도 있습니다.`;
    } else if (data.saved.state === "stale") {
      statusLine.textContent = "이전 선택 이후 시안이 변경되었습니다. 현재 시안에서 다시 선택해주세요.";
    }
    document.getElementById("close").addEventListener("click", () => detail.close());
    zoomButton.addEventListener("click", () => {
      const zoomed = zoomWindow.classList.toggle("zoomed");
      zoomButton.setAttribute("aria-pressed", String(zoomed));
      zoomButton.textContent = zoomed ? "화면에 맞춤" : "더 크게";
    });
    confirmButton.addEventListener("click", async () => {
      if (!selected) return;
      // Capture the submitted option even if the user changes radios during a save.
      const option = selected;
      const choice = {
        schema_version:1, fingerprint:data.fingerprint, selected_id:option.id,
        selected_name:option.name, svg:option.svg, selected_at:new Date().toISOString()
      };
      confirmButton.disabled = true;
      try {
        if (data.token) {
          const response = await fetch("/select", {
            method:"POST", headers:{"Content-Type":"application/json", "X-Selection-Token":data.token},
            body:JSON.stringify(choice)
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "선택을 저장하지 못했습니다.");
          statusLine.textContent = `${option.id}번 선택을 저장했습니다. 대화로 돌아가면 선택한 시안으로 이어갈 수 있습니다.`;
        } else {
          const url = URL.createObjectURL(new Blob([JSON.stringify(choice, null, 2) + "\n"], {type:"application/json"}));
          const link = document.createElement("a");
          link.href = url;
          link.download = "selection.json";
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          statusLine.textContent = `${option.id}번 선택 파일을 내려받았습니다. 대화에서 번호를 알려주거나 파일을 전달해주세요.`;
        }
        if (selected.id !== option.id) {
          statusLine.textContent += ` 현재 표시된 ${selected.id}번으로 바꾸려면 다시 진행 버튼을 눌러주세요.`;
        }
      } catch (error) {
        statusLine.textContent = `저장 실패: ${error.message} 시안이 변경되었다면 새로고침 후 선택해주세요.`;
      } finally {
        confirmButton.disabled = false;
      }
    });
  </script>
</body>
</html>
